# AI-Assisted.
# Source-PR CI for the CSR previews site. This repo holds ONLY source; there is
# no committed _site to verify, so this builds the HTML from source (--skip-pdf,
# no texlive step needed beyond the image) inside the pinned toolchain image
# (built from docker/Dockerfile) and runs the consistency + browser gates against
# the freshly built tree. The authoritative gates run in bin/csr-build (local) and
# the artifacts repo's pages.yml (deploy); this is the fast pre-merge smoke test.
# Dormant unless CI_ENABLED_ORG_AI_ASSISTED is set (CI is off by default here).

name: checks

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CSR_IMAGE: csr-build-toolchain:latest

jobs:
  check:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: source, persist-credentials: false }
      - name: Check out journal-maker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/journal-maker
          path: journal-maker
          persist-credentials: false
      - name: Check out dist-ai
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: org-ai-assisted/dist-ai
          path: dist-ai
          persist-credentials: false

      - name: Build HTML from source (no PDF) in the image
        run: >
          mkdir --parents build-out &&
          bash source/docker/docker-build-site.sh
          "${GITHUB_WORKSPACE}/journal-maker"
          "${GITHUB_WORKSPACE}/source"
          "${GITHUB_WORKSPACE}/build-out"
          --skip-pdf

      - name: Static consistency (check_site, in image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C
          --volume "${GITHUB_WORKSPACE}/dist-ai:/da:ro"
          --volume "${GITHUB_WORKSPACE}/build-out:/work:ro"
          "${CSR_IMAGE}" /da/usr/share/website-tests/check_site.py /work/_site

      - name: SVG active-content safety (in image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C
          --volume "${GITHUB_WORKSPACE}/dist-ai:/da:ro"
          --volume "${GITHUB_WORKSPACE}/build-out:/work:ro"
          "${CSR_IMAGE}" /da/usr/share/website-tests/check_svg_safety.py /work/_site

      - name: Mobile-overflow guard
        run: ./dist-ai/ci/website-mobile-check.sh "${GITHUB_WORKSPACE}/build-out/_site"

      - name: Width-utilization guard
        run: ./dist-ai/ci/website-width-check.sh "${GITHUB_WORKSPACE}/build-out/_site"
